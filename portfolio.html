<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="initial-scale=1, width=device-width" />
    <link rel="stylesheet" href="./global.css" />
    <link rel="stylesheet" href="./index.css" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Prosto+One:wght@400&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Judson:wght@400&display=swap" />
    <title>NEW Wings Drone Photography and Videography</title>
    <link rel="icon" type="image/png" href="./public/NEWWingsTransparent-1@2x.png" />
  </head>
  <!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-7FNQMYSM7L"></script>
<script>

  <body>
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
    <div class="blob blob-4"></div>

    <div class="logo-mark">
      <img src="./public/NEWWingsTransparent-1@2x.png" alt="NEW Wings" />
    </div>

    <div class="app-container">
      <div class="page-content">
        <h2 class="page-title">Our Work</h2>
        <div class="portfolio-grid" id="portfolioGrid"></div>
      </div>

      <nav class="bottom-nav">
        <a href="index.html" class="nav-link" title="Home">
          <img src="./public/Home.svg" alt="Home" />
          <span>Home</span>
        </a>
        <a href="portfolio.html" class="nav-link active" title="Portfolio">
          <img src="./public/Portfolio.svg" alt="Portfolio" />
          <span>Portfolio</span>
        </a>
        <a href="book.html" class="nav-link" title="Book">
          <img src="./public/Bookings.svg" alt="Bookings" />
          <span>Book</span>
        </a>
      </nav>

      <div id="lightbox" class="lightbox">
        <span class="lightbox-close" onclick="closeLightbox()">&times;</span>
        <button class="lightbox-nav lightbox-prev" onclick="changeLightbox(-1)">&#10094;</button>
        <img id="lightbox-img" class="lightbox-img" src="" alt="" />
        <button class="lightbox-nav lightbox-next" onclick="changeLightbox(1)">&#10095;</button>
        <div id="lightbox-caption" class="lightbox-caption"></div>
      </div>
    </div>

    <script>
      const logoMark = document.querySelector('.logo-mark');
      const bottomNav = document.querySelector('.bottom-nav');
      let isScrollActive = false;

      function updateNavVisibility() {
        if (window.scrollY > 50) {
          if (!isScrollActive) {
            logoMark.classList.add('scroll-active');
            bottomNav.classList.add('scroll-active');
            isScrollActive = true;
          }
        } else {
          if (isScrollActive) {
            logoMark.classList.remove('scroll-active');
            bottomNav.classList.remove('scroll-active');
            isScrollActive = false;
          }
        }
      }

      window.addEventListener('scroll', updateNavVisibility);
      updateNavVisibility();

      const portfolioImages = [
        { src: 'https://pub-3c3a4139956249b39ac97712593663e4.r2.dev/Portfolio/farm_scene.jpg', label: 'Farm Scene' },
        { src: 'https://pub-3c3a4139956249b39ac97712593663e4.r2.dev/Portfolio/fall_retreat.jpg', label: 'Fall Retreat' },
        { src: 'https://pub-3c3a4139956249b39ac97712593663e4.r2.dev/Portfolio/fallen_tree.jpg', label: 'Fallen Tree' },
        { src: 'https://pub-3c3a4139956249b39ac97712593663e4.r2.dev/Portfolio/combine.jpg', label: 'Combine' },
        { src: 'https://pub-3c3a4139956249b39ac97712593663e4.r2.dev/Portfolio/Bryce_high.jpg', label: 'Bryce Canyon' },
        { src: 'https://pub-3c3a4139956249b39ac97712593663e4.r2.dev/Portfolio/sedona_rocks.jpg', label: 'Sedona' },
        { src: 'https://pub-3c3a4139956249b39ac97712593663e4.r2.dev/Portfolio/boaters.jpg`', label: 'Boaters' },
        { src: 'https://pub-3c3a4139956249b39ac97712593663e4.r2.dev/Portfolio/ross_ade.jpg', label: 'Ross-Ade Stadium' },
        { src: 'https://pub-3c3a4139956249b39ac97712593663e4.r2.dev/Portfolio/purdue.jpg', label: 'Purdue' },
        { src: 'https://pub-3c3a4139956249b39ac97712593663e4.r2.dev/Portfolio/kokomo_bridge.jpg', label: 'Kokomo Bridge' },
        { src: 'https://pub-3c3a4139956249b39ac97712593663e4.r2.dev/Portfolio/kokomo.jpg', label: 'Kokomo' },
        { src: 'https://pub-3c3a4139956249b39ac97712593663e4.r2.dev/Portfolio/honduras_sunset.jpg', label: 'Honduras Sunset' },
        { src: 'https://pub-3c3a4139956249b39ac97712593663e4.r2.dev/Portfolio/honduras_water.jpg', label: 'Honduras Water' },
        { src: 'https://pub-3c3a4139956249b39ac97712593663e4.r2.dev/Portfolio/farm_wide.jpg', label: 'Farm Wide' },
        { src: 'https://pub-3c3a4139956249b39ac97712593663e4.r2.dev/Portfolio/windsor.jpg', label: 'Windsor' },
        { src: 'https://pub-3c3a4139956249b39ac97712593663e4.r2.dev/Portfolio/zion_wide.jpg', label: 'Zion' },
        { src: 'https://pub-3c3a4139956249b39ac97712593663e4.r2.dev/Portfolio/sedona_roundabout.jpg', label: 'Sedona Roundabout' },
        { src: 'https://pub-3c3a4139956249b39ac97712593663e4.r2.dev/Portfolio/sedona_rocks2.jpg', label: 'Sedona Rocks 2' },
        { src: 'https://pub-3c3a4139956249b39ac97712593663e4.r2.dev/Portfolio/sunset.jpg', label: 'Sunset' },
        { src: 'https://pub-3c3a4139956249b39ac97712593663e4.r2.dev/Portfolio/tree.jpg', label: 'Tree' }
      ];

      function loadPortfolio() {
        const grid = document.getElementById('portfolioGrid');
        portfolioImages.forEach((item, index) => {
          const card = document.createElement('div');
          card.className = 'portfolio-card';
          card.innerHTML = `
            <img src="${item.src}" alt="${item.label}" loading="lazy" />
            <div class="portfolio-label">${item.label}</div>
          `;
          card.addEventListener('click', () => openLightbox(index));
          grid.appendChild(card);
        });
      }

      let currentLightboxIndex = 0;
      const lightbox = document.getElementById('lightbox');
      const lightboxImg = document.getElementById('lightbox-img');
      const lightboxCaption = document.getElementById('lightbox-caption');

      function openLightbox(index) {
        currentLightboxIndex = index;
        updateLightbox();
        lightbox.classList.add('active');
        document.body.style.overflow = 'hidden'; 
      }

      function closeLightbox() {
        lightbox.classList.remove('active');
        document.body.style.overflow = 'auto';
      }

      function changeLightbox(dir) {
        currentLightboxIndex += dir;
        if (currentLightboxIndex < 0) currentLightboxIndex = portfolioImages.length - 1;
        if (currentLightboxIndex >= portfolioImages.length) currentLightboxIndex = 0;
        updateLightbox();
      }

      function updateLightbox() {
        lightboxImg.src = portfolioImages[currentLightboxIndex].src;
        lightboxCaption.textContent = portfolioImages[currentLightboxIndex].label;
      }

      lightbox.addEventListener('click', (e) => {
        if (e.target === lightbox) closeLightbox();
      });

      loadPortfolio();
    </script>
  </body>
</html>
