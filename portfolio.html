      function loadPortfolio() {
        const grid = document.getElementById('portfolioGrid');
        portfolioImages.forEach((item, index) => {
          const card = document.createElement('div');
          card.className = 'portfolio-card';
          // Loads the webp placeholder in the grid
          card.innerHTML = `
            <img src="${item.thumb}" alt="${item.label}" loading="lazy" />
            
          `;
          card.addEventListener('click', () => openLightbox(index));
          grid.appendChild(card);
        });
      }

      let currentLightboxIndex = 0;
      const lightbox = document.getElementById('lightbox');
      const lightboxImg = document.getElementById('lightbox-img');
      const lightboxCaption = document.getElementById('lightbox-caption');

      function openLightbox(index) {
        currentLightboxIndex = index;
        updateLightbox();
        lightbox.classList.add('active');
        document.body.style.overflow = 'hidden'; 
      }

      function closeLightbox() {
        lightbox.classList.remove('active');
        document.body.style.overflow = 'auto';
      }

      function changeLightbox(dir) {
        currentLightboxIndex += dir;
        if (currentLightboxIndex < 0) currentLightboxIndex = portfolioImages.length - 1;
        if (currentLightboxIndex >= portfolioImages.length) currentLightboxIndex = 0;
        updateLightbox();
      }

      function updateLightbox() {
        // Loads the full-res Cloudflare URL into the lightbox
        lightboxImg.src = portfolioImages[currentLightboxIndex].full;
        lightboxCaption.textContent = portfolioImages[currentLightboxIndex].label;
      }

      lightbox.addEventListener('click', (e) => {
        if (e.target === lightbox) closeLightbox();
      });

      loadPortfolio();

      const menuToggle = document.getElementById('menuToggle');
const topNavWrapper = document.querySelector('.top-nav-wrapper');

if (menuToggle && topNavWrapper) {
  menuToggle.addEventListener('click', (e) => {
    e.stopPropagation();
    topNavWrapper.classList.toggle('menu-open');
  });

  document.addEventListener('click', (e) => {
    if (!topNavWrapper.contains(e.target) && topNavWrapper.classList.contains('menu-open')) {
      topNavWrapper.classList.remove('menu-open');
    }
  });
}
